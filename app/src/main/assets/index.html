/* Placar gesto + modo imersivo */
.score-team{touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;display:flex;flex-direction:column;justify-content:center;min-height:270px}
.score-team h3{font-size:clamp(17px,3vw,27px);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.score-team .flip{font-size:clamp(90px,23vw,170px);margin:0;min-height:185px;pointer-events:none}
.gesture-hint{color:#92a6be;text-align:center;font-size:12px;margin:12px 2px 20px}
.score-actions{display:flex;flex-wrap:wrap;gap:8px}.score-actions .btn{flex:1 1 120px}
.immersive{position:fixed!important;inset:0!important;margin:0!important;padding:0!important;width:100vw!important;height:100dvh!important;min-height:0!important;max-width:none!important;background:#050b15;z-index:100;display:flex;flex-direction:column;overflow:hidden}
.immersive .score-top,.immersive .score-meta,.immersive .streak-row,.immersive .score-actions,.immersive .score-footer,.immersive .gesture-hint{display:none!important}
.immersive .score-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.immersive .score-team{min-width:0;min-height:0;height:100%;border-radius:18px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:12px;touch-action:none}
.immersive .score-team h3{margin:0 0 8px;font-size:clamp(14px,3.8vw,35px)}
.immersive .flip{flex:1;min-height:0;width:100%;margin:0;display:flex;align-items:center;justify-content:center;font-size:clamp(85px,23vw,320px);line-height:1;font-weight:900;letter-spacing:-.04em}
.immersive-exit{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:102;border:1px solid #ffffff30;background:#111b2caa;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;opacity:.7}
.threshold-celebrate{position:fixed;inset:0;z-index:110;background:#06101bdc;display:grid;place-items:center;pointer-events:none;overflow:hidden}.threshold-message{text-align:center;z-index:1;animation:pop .65s both;padding:18px}.threshold-message h2{font-size:clamp(29px,7vw,65px);color:#b8f34b}.threshold-message p{font-size:clamp(18px,4vw,27px);margin-top:12px}.threshold-trophy{font-size:clamp(75px,15vw,145px)}
@media (orientation:landscape){.immersive .flip{font-size:clamp(105px,28vh,310px)}.immersive .score-team h3{font-size:clamp(16px,4vh,34px)}.score-team{min-height:180px}}
@media (prefers-reduced-motion:reduce){.threshold-message,.flip.changed:after{animation:none!important}.confetti{display:none!important}}

/* V3: layout que responde à dimensão real da tela sem forçar rotação */
.immersive{height:100dvh!important;height:100svh!important;max-height:100dvh;overscroll-behavior:contain}
.immersive .score-grid{width:100%;max-width:none;min-height:0;align-content:stretch;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.immersive .score-team{min-width:0;min-height:0;overflow:hidden;padding:clamp(5px,1.6vmin,18px)}
.immersive .score-team h3{flex:0 0 auto;line-height:1.08;margin:0 0 6px;font-size:clamp(15px,3.6vmin,30px)}
.immersive .flip{width:100%;min-width:0;min-height:0;overflow:hidden;padding:0;line-height:.95;font-size:clamp(54px,17vw,260px);font-variant-numeric:tabular-nums}
.immersive .flip::after{border-radius:12px}
/* Portrait mode: top and bottom scores, independent of fullscreen API */
@media (orientation:portrait), (max-aspect-ratio:1/1){
 .immersive .score-grid{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:6px!important;padding:6px!important}
 .immersive .score-team{height:100%;max-width:100%;border-radius:16px}
 .immersive .score-team h3{font-size:clamp(17px,3.6vh,30px)!important;margin:0 0 4px}
 .immersive .flip{font-size:clamp(80px,23vh,240px)!important;letter-spacing:-.055em}
}
@media (orientation:landscape) and (min-aspect-ratio:1/1){
 .immersive .score-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:minmax(0,1fr)!important}
 .immersive .flip{font-size:clamp(75px,35vh,270px)!important}
}
.immersive-exit{width:42px;height:42px;opacity:.85;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top))}
.help-hero{background:linear-gradient(135deg,#253c38,#18283e);border:1px solid #3a5a4e;padding:19px;border-radius:19px;margin:16px 0}
.help-card{border:1px solid var(--stroke);border-radius:16px;background:var(--card);margin:10px 0;overflow:hidden}
.help-card summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;list-style:none;padding:17px;color:var(--ink);font-weight:800}
.help-card summary::-webkit-details-marker{display:none}
.help-card summary::after{content:'⌄';color:var(--lime);font-size:19px}
.help-card[open] summary::after{content:'⌃'}
.help-text{padding:0 17px 17px;color:var(--muted);font-size:13px;line-height:1.75}
.help-text b{color:var(--ink)}
.help-cta{display:flex;gap:10px;align-items:center;margin:18px 0 6px}
@media (prefers-reduced-motion:reduce){.flip.changed:after,.threshold-message{animation:none!important}}

/* V4 — sorteio sugerido e indicador de formação */
.rebalance-prompt{background:linear-gradient(145deg,#223b31,#172740);border:1px solid #60803f;border-radius:22px;padding:20px;margin:18px 0;box-shadow:0 15px 40px #0003}
.rebalance-prompt h3{color:#b8f34b;font-size:22px;margin:5px 0 8px}
.rebalance-prompt .prompt-icon{font-size:31px}
.rebalance-prompt .btn{margin-top:10px}

/* V5: placar realmente fora do container de 480px, inclusive no Safari iOS */
body:has(.immersive){overflow:hidden}
body>.immersive{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;z-index:1000!important;margin:0!important;padding:0!important;overflow:hidden!important;box-sizing:border-box}
body>.immersive .score-grid{height:100%;width:100%;min-width:0;min-height:0;flex:1;gap:clamp(4px,1vmin,12px)}
body>.immersive .score-team{min-width:0;min-height:0;max-width:100%;height:100%;padding:clamp(5px,1.4vmin,15px);overflow:hidden}
body>.immersive .flip{min-height:0;max-width:100%;overflow:hidden;font-size:clamp(64px, min(21vw,32vh), 290px)!important}
body>.immersive .score-team h3{flex-shrink:0}
body>.modal-back{z-index:1200!important}
.immersive-help{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:1100;border:1px solid #ffffff50;background:#13223cdb;color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px}
body>.immersive .immersive-exit{z-index:1100}
@media (orientation:portrait){body>.immersive .score-grid{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:repeat(2,minmax(0,1fr))!important}body>.immersive .flip{font-size:clamp(70px, min(35vw,23vh), 230px)!important}}
@media (orientation:landscape){body>.immersive .score-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:minmax(0,1fr)!important}body>.immersive .flip{font-size:clamp(62px,min(20vw,48vh),290px)!important}}

/* V7 — Mechanical flip score: measured glyphs, self-contained slots */
.score-team{min-width:0!important;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:stretch;align-items:stretch}
.score-team h3{flex:0 0 auto;text-align:center;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}

.flip-glyph{position:absolute;left:0;width:100%;height:200%;display:flex;justify-content:center;align-items:center;color:#fff;font-family:Outfit,system-ui,sans-serif;font-size:var(--digit-size,100px);font-weight:900;line-height:1;letter-spacing:-.07em;font-variant-numeric:tabular-nums;text-shadow:0 3px 2px #0003;white-space:nowrap}

'America/Cuiaba'});const active=()=>state.active;const allGames=()=>state.sessions.concat(active()?[active()]:[]);const icon={home:'⌂',players:'♟',matches:'▣',ranking:'🏆'};const tab=(key,label)=>`<button class="nav-btn ${screen===key?'active':''}" data-act="nav" data-to="${key}"><span class="ico">${icon[key]}</span><small>${label}</small></button>`;const pips=(n,max=3)=>Array.from({length:Math.min(max,8)},(_,i)=>`<span style="display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:50%;background:${i<n?'var(--lime)':'#42536b'}"></span>`).join('');const btn=(text,action,cls='',attrs='')=>`<button class="btn ${cls}" data-act="${action}" ${attrs}>${text}</button>`;function header(){return `<header class="top"><div class="logo" data-act="nav" data-to="home"><div class="mark">🏐</div><div class="brand">MATCH<small>POINT</small></div></div><button class="round" data-act="help" title="Central de Ajuda" aria-label="Abrir Central de Ajuda">?</button></header>`}function nav(){return `<nav class="bottom">${tab('home','Início')}${tab('players','Jogadores')}${tab('matches','Partidas')}${tab('ranking','Ranking')}</nav>`}function helpPage(){return `<button class="btn secondary sm" data-act="help-back" style="margin-bottom:16px">← Voltar para ${helpReturn==='court'?'placar':'tela anterior'}</button><div class="eyebrow">MANUAL DO APLICATIVO</div><h1>Central de Ajuda <span style="color:var(--lime)">?</span></h1><p class="sub">Entenda como o MatchPoint funciona, desde a convocação até a próxima partida.</p><div class="help-hero"><div style="font-size:34px">🏐 📖</div><h2 style="margin:9px 0">Simples na quadra.<br><span style="color:var(--lime)">Justo no sorteio.</span></h2><p class="sub">Este guia descreve as regras da demonstração. Algumas decisões poderão ser ajustadas na versão definitiva.</p></div>
<details class="help-card" open><summary>▶️ Como iniciar um jogo?</summary><div class="help-text">Na aba <b>Início</b>, toque em <b>Iniciar jogo</b>. Marque os jogadores presentes, configure quantos jogam por time e os pontos necessários para vencer. Depois faça o sorteio e confirme os times. Se o jogo já estiver aberto, aparece <b>Continuar jogo</b>.</div></details>
<details class="help-card"><summary>👥 Cadastro e convocação</summary><div class="help-text">O cadastro contém: nome, categoria <b>Feminino ou Masculino</b> e habilidade inicial de <b>0 a 5</b>, sem foto nem posição. A cada sexta-feira, marque somente quem veio. Dá para cadastrar um novato durante a convocação. Em Jogadores, é possível excluir cadastros sem partidas ou arquivar quem já jogou, preservando o histórico. Arquivados podem ser restaurados.</div></details>
<details class="help-card"><summary>🎲 Como funciona o sorteio?</summary><div class="help-text">A quantidade por time é definida em cada encontro: pode ser 2, 3, 4, 5, 6 ou mais, desde que existam jogadores para dois times. Com <b>Vôlei misto</b> ligado, o sorteio procura distribuir as jogadoras entre as equipes (pelo menos uma por time quando for possível) e equilibrar o índice de habilidade. Caso faltem jogadoras, mostra um aviso e faz a melhor distribuição disponível. A opção pode ser desligada para sortear apenas por habilidade. Quem não couber em um time completo começa como reserva, com prioridade no rodízio. Você pode sortear novamente antes de confirmar.</div></details>
<details class="help-card"><summary>🔢 Placar e gestos</summary><div class="help-text">Toque em <b>Placar em tela cheia</b>. Com o celular em pé, os times ficam <b>um acima do outro</b>; deitado, ficam <b>lado a lado</b>. Deslize <b>para baixo</b> sobre um time para <b>somar 1 ponto</b> e <b>para cima</b> para <b>diminuir 1 ponto</b>. Ao atingir a meta e a diferença mínima configuradas, aparece uma comemoração e a janela de confirmação. Você pode revisar antes de salvar a vitória.</div></details>
<details class="help-card"><summary>😂 Frases e comemorações inteligentes</summary><div class="help-text">O aplicativo identifica a categoria da vitória pela <b>meta escolhida para esta partida</b>, não por um valor fixo. Vitória apertada: diferença de até 12% da meta. Lavada: a partir de 35%. Entre esses valores: vitória tranquila. <b>Virada épica</b>: o vencedor esteve atrás por pelo menos 30% da meta, calculado pelo histórico dos pontos. <b>Jogo interminável</b>: com diferença mínima de 2 ou mais, o perdedor também atingiu a meta. A sequência especial acontece quando um time atinge o limite configurado de vitórias consecutivas. Quando várias situações coincidirem, priorizamos virada, jogo interminável, sequência e depois diferença de pontos. Uma entre três frases é sorteada por categoria, evitando repetição seguida quando possível.</div></details>
<details class="help-card"><summary>🏆 Confirmação e comemoração</summary><div class="help-text">Atingir a meta de pontos <b>não salva o jogo automaticamente</b>. O app mostra confetes e depois pede confirmação. Em <b>Revisar placar</b> você corrige um erro. Em <b>Confirmar vitória</b> a partida é registrada, o ranking é recalculado e o aplicativo apresenta o próximo confronto.</div></details>
<details class="help-card"><summary>🔄 Rodízio e três vitórias</summary><div class="help-text">O vencedor fica até atingir o limite de vitórias consecutivas (inicialmente <b>3</b>, mas configurável). Quando há reservas individuais, elas entram prioritariamente na equipe perdedora, que é reorganizada. Quando um time completo está aguardando, a fila de times define a entrada. Ao atingir o limite, o vencedor precisa descansar. <b>Nota:</b> o rodízio desta versão é uma simulação inicial e ainda será refinado para casos especiais.</div></details>
<details class="help-card"><summary>📈 Ranking e classificação</summary><div class="help-text">A nota inicial de 0 a 5 vira uma pontuação interna. Cada resultado confirmado aumenta ou reduz a classificação de quem <b>participou efetivamente</b>. Vencer uma equipe mais forte tende a render mais pontos. Uma derrota também pode reduzir o índice. Quem não jogou a partida não perde nem ganha pontos.</div></details>
<details class="help-card"><summary>🗓️ Partidas e histórico</summary><div class="help-text">A aba <b>Partidas</b> reúne os encontros por data e local. Ao abrir um encontro, você vê os confrontos, os resultados, os jogadores e os destaques. Não é necessário ter uma aba separada para histórico.</div></details>
<details class="help-card"><summary>🔀 Reequilíbrio a cada 9 vitórias</summary><div class="help-text">Uma mesma formação acumula vitórias mesmo depois de descansar. Ao chegar a <b>9 vitórias acumuladas</b> (ou outro limite escolhido), o aplicativo <b>sugere</b> um novo sorteio com todos os presentes. Nada acontece sem sua confirmação. Também é possível pedir um novo sorteio manualmente entre partidas. Ao trocar jogadores de uma equipe, ela é considerada uma nova formação e reinicia suas contagens; as vitórias individuais e o histórico continuam salvos.</div></details><details class="help-card"><summary>⚙️ Posso mudar as regras?</summary><div class="help-text">Sim. Antes de sortear, defina o número de jogadores por time, a meta de pontos, a diferença mínima e o limite de vitórias. Durante o jogo, <b>Regras</b> permite mudar a meta do placar. Uma mudança que já satisfaz a condição de vitória ainda precisa ser confirmada antes de registrar resultado.</div></details>

<div class="help-cta">${btn('← Voltar ao início','help-back','secondary full')}</div>`}

function v10Move(source,pid,dest,swapId){

 if(dest!=='reserves'&&to.length>= (screen==='wizard'?state.settings.size:active().size)){
   if(!swapId||!to.includes(swapId)){notify('Time completo: arraste sobre o nome de quem será trocado.');return;}
   to.splice(to.indexOf(swapId),1,pid);from.splice(from.indexOf(pid),1,swapId);
 }else{from.splice(from.indexOf(pid),1);to.push(pid);}

 if(dest!=='reserves'){let team=d.teams.find(t=>t.id===dest);team.streak=0;team.totalWins=0;}

}

iff===1?'selected':''}>Sem vantagem obrigatória</option><option value="2" ${x.diff===2?'selected':''}>2 pontos de vantagem</option><option value="3" ${x.diff===3?'selected':''}>3 pontos de vantagem</option></select></div><div class="field"><label>Vitórias seguidas antes de sair</label><input id="streak" type="number" min="1" max="30" value="${x.streak}"></div><div class="field"><label>Sugerir novo sorteio após quantas vitórias acumuladas da mesma formação?</label><input id="rebalance" type="number" min="1" max="99" value="${x.rebalance??9}"><span class="hint">Padrão: 9 vitórias (3 ciclos de 3). É apenas uma sugestão, não obriga o sorteio.</span></div></div><div class="stats"><div class="stat"><strong>${Math.floor(state.selected.length/x.size)}</strong><span>Times completos</span></div><div class="stat"><strong>${state.selected.length%x.size}</strong><span>Reservas</span></div><div class="stat"><strong>${state.selected.length}</strong><span>Presentes</span></div></div><div class="note">💡 Configurações válidas para esta sexta. Você poderá alterar a meta durante uma partida.</div><div class="gap"></div><div class="toolbar">${btn('← Voltar','prev','secondary')}${btn('Sortear equipes →','next','full',state.selected.length<x.size*2?'disabled':'')}</div>`}function makeTeams(ids,size){

   let fCounts=Array(count).fill(Math.floor(targetFemale/count));
   for(let i=0;i<targetFemale%count;i++)fCounts[i]++;
   for(let i=0;i<count;i++){

 return {teams,reserves,warning};
}let draft=null,rebalanceDraft=null;function drawView(){return v10Draw();if(!draft)draft=makeTeams(state.selected,state.settings.size);return `<div class="row"><span class="pill">${state.settings.mixed?'⚖ Habilidade + composição mista':'⚖ Sorteio por habilidade'}</span>${btn('⟳ Refazer','redraw','secondary sm')}</div>${draft.warning?`<div class="note" style="border-color:#f9b45c;color:#f9dba4">⚠ ${esc(draft.warning)}</div>`:''}${draft.teams.map((t,i)=>teamCard(t,i)).join('')}${draft.reserves.length?`<div class="card"><h3>⏳ Aguardando vez</h3><div class="chips">${draft.reserves.map(p=>`<span class="chip">${esc(player(p)?.name)}</span>`).join('')}</div><p class="hint" style="margin-top:12px">Esses jogadores têm prioridade nas substituições da equipe perdedora.</p></div>`:''}<div class="note">O equilíbrio utiliza o índice de habilidade e, quando ativado, a composição feminina e masculina. Você pode refazer o sorteio antes de começar.</div><div class="gap"></div><div class="toolbar">${btn('← Voltar','prev','secondary')}${btn('Confirmar times →','confirm-teams','full')}</div>`}function teamCard(t,i){return v10TeamCard(t,null,false);let colors=['#4eabfa','#ff668f','#b8f34b','#ffb45f','#b89bff'];return `<div class="team"><div class="team-head"><h3><span class="dot" style="background:${colors[i%colors.length]}"></span>Time ${esc(t.name)}</h3><span class="pill gray">♀ ${t.members.filter(pid=>player(pid)?.gender==='F').length} · ♂ ${t.members.filter(pid=>player(pid)?.gender==='M').length} · média ${Math.round(avg(t.members))}</span></div><div class="chips">${t.members.map(p=>`<span class="chip">${genderTag(player(p))} ${esc(player(p)?.name)}</span>`).join('')}</div></div>`}function setupSession(){if(active())return;let s={id:id(),date:new Date().toISOString(),venue:state.settings.venue.trim()||'Quadra de vôlei',size:state.settings.size,target:state.settings.target,diff:state.settings.diff,streakLimit:state.settings.streak,rebalanceLimit:state.settings.rebalance||9,mixed:state function getMatchMood(s){

function v10DragMove(x,y){
